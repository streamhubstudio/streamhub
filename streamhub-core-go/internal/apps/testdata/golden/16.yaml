notifications:
  email: ops@example.com
cluster:
  role: edge
name: gold-b
display_name: gold-b
room_prefix: gold-b
timezone: ''
recording:
  enabled: true
  mode: room-composite
  layout: grid
  local_dir: recordings
  delete_local_after_upload: true
  split_minutes: '15'
  snapshot_seconds: 0
  filename_template: ''
  snapshot_template: ''
  retention_days: 0
  extra_knob: 3
s3:
  provider: wasabi
  bucket: ''
  region: us-east-1
  endpoint: https://s3.us-east-1.wasabisys.com
  force_path_style: false
  prefix: streamhub/gold-b
  public_url: ''
  access_key_env: APP_GOLD_B_S3_KEY
  secret_key_env: APP_GOLD_B_S3_SECRET
webrtc:
  adaptive: true
  layers:
    - name: high
      height: 720
    - name: med
      height: 480
    - name: low
      height: 240
  transcode_max_height: 360
rtmp:
  enabled: true
  transcode: true
  passthrough: false
quotas:
  max_concurrent_streams: '4'
  max_viewers_per_stream: -2
transcoding:
  enabled: true
  encoding: h264
  vod_adaptive: false
  vod_renditions: []
callbacks:
  url: ''
  secret: ''
mqtt:
  enabled: false
  url: ''
  username: ''
  password_env: APP_GOLD_B_MQTT_PASSWORD
  topic_prefix: streamhub/gold-b
  qos: 3
  tls: false
  events:
    - all
  logs:
    enabled: false
    level: loud
latency_alert:
  enabled: false
  threshold_ms: 1000
  cooldown_seconds: 60
  interval_seconds: 10
smtp:
  enabled: false
  host: ''
  port: 99999
  user: ''
  from: ''
  pass_env: APP_GOLD_B_SMTP_PASS
  pass: inline
features:
  rtmp_password: false
  viewer_counter: true
  chat: false
  reactions: false
  hidden_qc: true
  adaptive_player: true
  public_playback: true
  linear:
    persistent_room: false
    room_empty_timeout_seconds: 86400
    always_on_hls: false
    dvr: true
    dvr_window_seconds: 0
  ws_ingest:
    max_fps: 0
    max_cameras: -1
variables:
  '7': seven
  zeta: 1
  alpha:
    - a
    - b
