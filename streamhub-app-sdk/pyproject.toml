[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "streamhub-app-sdk"
version = "0.1.0"
description = "Python contract for StreamHub decoupled Studio App workers (migrations runner + callback helpers)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["streamhub_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
