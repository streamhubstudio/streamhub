# StreamHub Agent secrets — example template.
#
# Copy to `secrets.ini` and fill in your real credentials. `secrets.ini` is
# gitignored and must stay 0600 — NEVER commit it. The agent reads only these
# two sections (see src/config.c config_load_secrets).

# StreamHub REST API token — an sk_ bearer token minted for your app.
# Used for the plugin /live detection subscription and API callbacks.
[streamhub]
api_token = sk_replace_me

# S3-compatible object storage for uploaded records (optional).
# Leave blank to disable off-box uploads.
[s3]
access_key =
secret_key =
