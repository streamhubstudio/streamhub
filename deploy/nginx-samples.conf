# StreamHub — origen propio de los samples (opcional, features/samples.md).
# Con STREAMHUB_SAMPLES_URL=https://samples.example.com en el entorno del core,
# las páginas de samples (HTML editable por tenants) se sirven SOLO en este host,
# nunca en el origen del dashboard (cuyo localStorage guarda el JWT). El core hace
# el split por Host: acá sirve /samples, /api, /sdk y /hls (lo que los samples
# llaman same-origin) y redirige todo lo demás (SPA incluida) al dashboard; y
# /samples/* en el dashboard redirige acá. Por eso es imprescindible
# `proxy_set_header Host $host`. Sin /rtc: los samples conectan a LiveKit por
# PUBLIC_WS_URL (el dominio del dashboard).
# Reemplazar samples.example.com. `certbot --nginx -d samples.example.com` agrega
# el bloque 443 (SSL) + redirect 80->443. install.sh --samples-domain lo instala.
server {
    listen 80;
    listen [::]:80;
    server_name samples.example.com;
    client_max_body_size 50m;

    # /metrics NO se expone al exterior (tampoco por este host).
    location = /metrics {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
