# LiveKit server config — TEMPLATE.
# El archivo real vive en el server en /etc/livekit/livekit.yaml (chmod 600, owner root).
# Reemplazar <API_KEY>/<API_SECRET> por los generados con `livekit-server generate-keys`.
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881
  udp_port: 7882          # puerto UDP unico (mux) — abierto en firewall
  use_external_ip: true   # autodetecta la IP publica via STUN
redis:
  address: localhost:6379
keys:
  <API_KEY>: <API_SECRET>
# TURN relay — OFF by default. El shape Docker maneja este bloque via seams
# (STREAMHUB_TURN_ENABLE / STREAMHUB_TURN_DOMAIN — installer `--turn`); en este
# shape bare-metal/systemd se activa a mano. Sin TURN, los clientes detras de NAT
# simetrico / VPN / firewall corporativo NO conectan (Safari/iOS el mas estricto;
# ver https://streamhub.studio/docs/features/WEBRTC-BROWSER-COMPAT, seccion TURN). Para activar:
# poner enabled:true, apuntar domain a turn.<dominio> (su propio A record DNS) y
# cert_file/key_file a los PEM de ese dominio (certbot: /etc/letsencrypt/live/
# turn.<dominio>/). Abrir 5349/tcp + 3478/udp en el firewall. LiveKit termina el
# TLS el mismo — el cliente no toca nada (los ICE servers llegan en el JoinResponse).
turn:
  enabled: false
  domain: turn.<dominio>
  tls_port: 5349          # ideal: tambien 443 para redes que solo dejan salir 443
  udp_port: 3478
  cert_file: /etc/letsencrypt/live/turn.<dominio>/fullchain.pem
  key_file: /etc/letsencrypt/live/turn.<dominio>/privkey.pem
# live-control resume desmutea server-side los tracks del publisher: sin esto
# LiveKit rechaza el unmute y el audio queda muteado para siempre.
room:
  enable_remote_unmute: true
# URLs publicas de ingest que LiveKit devuelve en CreateIngress `url` (WHIP las
# muestra el dashboard). LiveKit >=1.13 devuelve "" si faltan.
ingress:
  rtmp_base_url: rtmp://<dominio>:1935/live
  whip_base_url: http://<dominio>:8080/w
logging:
  level: info
  json: false
