# StreamHub — HLS EDGE CACHE (nginx reverse proxy)
# =============================================================================
# Drop this on an EDGE node placed near your viewers. It fronts a StreamHub
# ORIGIN's /hls surface with a caching reverse proxy so live-viewer fan-out
# bandwidth is served from the edge instead of hammering the origin's egress:
#
#   viewer ──HTTP──> [ this nginx edge : /hls ] ──cache-miss──> [ StreamHub origin ]
#
# It HONORS the origin's Cache-Control (StreamHub sends them when
# STREAMHUB_HLS_CDN=on — see https://streamhub.studio/docs/features/HLS-CDN):
#   * .ts  segments  -> public, max-age=1y, immutable   (cached ~forever)
#   * .m3u8 playlist -> public, max-age=1, stale-while-revalidate=2  (live edge)
#   * .m3u8 finished -> public, max-age=3600            (ended stream / replay)
# nginx respects those upstream directives automatically; the proxy_cache_valid
# lines below are only fallbacks for responses that arrive without them.
#
# CROSS-NODE CAVEAT: segments live on the node whose egress produced them. This
# edge pulls through to ONE origin; true multi-region needs egress->S3 first
# (CLUSTER-ROADMAP.md §4 #0). See features/HLS-CDN.md.
#
# Requires only the stock ngx_http_proxy_module (built into mainline nginx).
# Set the two >>> markers (origin URL + server_name) before use.
# =============================================================================

# Shared cache store. Size the disk (max_size) to hold your hottest segments;
# 20g holds a lot of 4s .ts at typical live bitrates. keys_zone lives in RAM.
proxy_cache_path /var/cache/nginx/hls
    levels=1:2
    keys_zone=hls_cache:64m
    max_size=20g
    inactive=2h
    use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    # For production put a real cert here and listen 443 ssl; viewers should
    # reach the edge over HTTPS (HLS in a browser follows the page's scheme).
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/edge.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/edge.example.com/privkey.pem;

    server_name edge.example.com;                      # >>> your edge hostname

    # Only the cacheable HLS surface is served here. Everything else 404s (the
    # control plane / API / SPA stays on the origin, uncached).
    location /hls/ {
        # >>> the StreamHub origin. https:// for a public origin (recommended),
        #     or http://10.x.x.x for a trusted private link to the origin box.
        proxy_pass https://origin.example.com;
        proxy_ssl_server_name on;                      # send SNI for the vhost
        proxy_set_header Host              $proxy_host; # match the origin cert/vhost
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache hls_cache;
        # Key on the path + query only (not the volatile client Host/UA), so all
        # viewers of the same segment/playlist collapse onto ONE cache entry.
        proxy_cache_key "$uri$is_args$args";

        # Collapse a burst of concurrent viewers requesting the SAME uncached
        # object into a single origin fetch; the rest wait for the fill.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # stale-while-revalidate / stale-if-error: serve the slightly-stale
        # playlist while ONE background request refreshes it, and shield the
        # origin during a blip. (nginx also natively honors the upstream
        # `stale-while-revalidate`/`stale-if-error` Cache-Control extensions.)
        proxy_cache_use_stale updating error timeout
                              http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;                     # conditional GET on refresh

        # Fallbacks ONLY for upstream responses that carry no Cache-Control
        # (the origin normally sets them, so these rarely apply):
        proxy_cache_valid 200 1s;                      # brief default for playlists
        proxy_cache_valid 404 1s;                      # don't pin a transient 404

        # Expose hit/miss for debugging: `curl -I` shows X-Cache-Status.
        add_header X-Cache-Status $upstream_cache_status always;
        # Keep CORS open for cross-origin players (origin also sends ACAO:*).
        add_header Access-Control-Allow-Origin '*' always;
    }

    location = / { return 404; }
}
