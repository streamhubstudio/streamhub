# ============================================================================
# EXPOSICIÓN DE MÉTRICAS POR NODO (stream02 / stream03) — snippet de nginx.
# ============================================================================
# Cada nodo del cluster tiene streamhub-core con /metrics bindeado SÓLO a
# 127.0.0.1:3020 (no alcanzable de afuera). Estos `location` exponen las
# métricas al MASTER (203.0.113.10) y NADIE MÁS, sobre el TLS que ya sirve
# nginx en el nodo.
#
# ---------------------------------------------------------------------------
# DÓNDE VA:
#   Dentro del `server { ... }` de TLS (listen 443 ssl) que ya proxya la app
#   del nodo a streamhub-core (el que tiene `location / { proxy_pass ...:3020 }`).
#   Pegá estos bloques ANTES del `location /` (los `location =` exactos ganan
#   igual por prioridad, pero mantenerlos arriba es más legible).
#
#   Archivo típico en el nodo: /etc/nginx/sites-enabled/streamhub.conf (o el
#   nombre que use el instalador del media stack). Tras pegarlo:
#     nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------
# SEGURIDAD:
#   * `allow 203.0.113.10; deny all;` -> sólo el master scrapea. `$remote_addr`
#     es el master porque Prometheus conecta DIRECTO al nginx del nodo (sin
#     proxy intermedio). Si tu nodo está detrás de un CDN/proxy, ajustá con
#     real_ip / X-Forwarded-For, o expone en un puerto aparte no proxeado.
#   * El Bearer token del core viaja DENTRO del TLS del nodo -> cifrado. nginx
#     reenvía el header Authorization tal cual (no lo toca).
#   * Sin estos bloques, `location /` dejaría /metrics accesible a cualquiera
#     (el core respondería 403 sin token, pero igual conviene restringirlo).
# ---------------------------------------------------------------------------
# LO QUE SCRAPEA EL MASTER (ver deploy/observability/prometheus.cluster.yml):
#   https://<nodo>:443/metrics          -> streamhub-core   (Bearer)
#   https://<nodo>:443/metrics/livekit  -> livekit  :6789
#   https://<nodo>:443/metrics/ingress  -> ingress  :6790
#   https://<nodo>:443/metrics/egress   -> egress   :6791
# (node_exporter NO va por acá: es :9100 directo + ufw — ver node-agent-compose.yml)
# ============================================================================

# streamhub-core /metrics (lleva el Bearer end-to-end, cifrado por TLS)
location = /metrics {
    allow 203.0.113.10;
    deny all;
    proxy_pass http://127.0.0.1:3020/metrics;
    proxy_set_header Host $host;
    proxy_pass_request_headers on;   # reenvía Authorization: Bearer <token>
}

# LiveKit SFU (requiere prometheus_port: 6789 en LIVEKIT_CONFIG_BODY del nodo)
location = /metrics/livekit {
    allow 203.0.113.10;
    deny all;
    proxy_pass http://127.0.0.1:6789/metrics;
    proxy_set_header Host $host;
}

# LiveKit ingress (requiere prometheus_port: 6790 en INGRESS_CONFIG_BODY)
location = /metrics/ingress {
    allow 203.0.113.10;
    deny all;
    proxy_pass http://127.0.0.1:6790/metrics;
    proxy_set_header Host $host;
}

# LiveKit egress (requiere prometheus_port: 6791 en EGRESS_CONFIG_BODY)
location = /metrics/egress {
    allow 203.0.113.10;
    deny all;
    proxy_pass http://127.0.0.1:6791/metrics;
    proxy_set_header Host $host;
}
