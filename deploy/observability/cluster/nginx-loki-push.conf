# ============================================================================
# INGRESO DE LOGS AL MASTER (stream01) — snippet de nginx.
# ============================================================================
# Loki bindea 127.0.0.1:3100 en el master (no expuesto). Este `location` deja
# que SÓLO los Promtail de los nodos (stream02/03) empujen logs, sobre el TLS
# que ya sirve nginx en el master, sin abrir Loki al mundo.
#
# ---------------------------------------------------------------------------
# DÓNDE VA:
#   Dentro del `server { listen 443 ssl; ... }` del MASTER (stream01) — el
#   mismo que sirve la app / Grafana. Tras pegarlo:
#     nginx -t && systemctl reload nginx
#
# URL de push resultante (la que ponés en MASTER_LOKI_PUSH_URL de cada nodo):
#     https://<fqdn-del-master>/loki/api/v1/push
# ---------------------------------------------------------------------------
# SEGURIDAD:
#   * allowlist SÓLO las IPs de los nodos del cluster. deny all corta el resto.
#   * Loki no tiene auth propia (auth_enabled: false) -> esta allowlist ES el
#     control de acceso. No la quites.
#   * client_max_body_size: los batches de Promtail pueden ser MB; 10m holgado.
# ---------------------------------------------------------------------------
# ALTERNATIVA sin nginx (más simple, menos segura):
#   Bindear Loki a la IP privada/pública del master y `ufw allow from
#   203.0.113.11` y `.58` to port 3100. Cleartext -> los logs viajan sin
#   cifrar. Preferí este snippet (TLS) salvo que haya red privada entre nodos.
# ============================================================================

location /loki/api/v1/push {
    allow 203.0.113.11;   # stream02
    allow 203.0.113.12;   # stream03
    deny all;

    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    client_max_body_size 10m;

    # Timeouts holgados para batches grandes de Promtail.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
