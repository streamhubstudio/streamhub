# StreamHub — UN SOLO dominio, UN SOLO servicio (el core Go, binario estático).
# /rtc -> LiveKit signaling (wss). Todo lo demas -> el core Go (streamhub-core), que sirve API + SPA React.
# Reemplazar streamhub.example.com. `certbot --nginx` agrega el bloque 443 (SSL) + redirect 80->443.

# HLS direct-serve: politica de cache por extension (segmentos immutable, playlists
# no-cache). En contexto http para que el location /hls la tome con un solo add_header.
map $uri $streamhub_hls_cache {
    default   "no-cache";
    ~\.ts$    "public, max-age=31536000, immutable";
    ~\.m3u8$  "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name streamhub.example.com;
    client_max_body_size 50m;

    # --- LiveKit signaling (WebRTC) — el cliente conecta a wss://streamhub.example.com ---
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- /metrics NO se expone al exterior ---
    # Prometheus scrapea el core en 127.0.0.1:3020/metrics directo (localhost),
    # asi que aca lo bloqueamos. Va ANTES de `location /` (match exacto gana).
    location = /metrics {
        deny all;
        return 403;
    }

    # --- HLS direct-serve (STREAMHUB_HLS_DIRECT_SERVE, operations/SCALING.md) ---
    # Opt-in. Con el flag ON, install.sh reemplaza __STREAMHUB_HLS_ROOT__ por el
    # DATA_DIR del host y nginx sirve los .ts/.m3u8 en vivo DIRECTO DEL DISCO
    # (sendfile): el core no toca los bytes de los segmentos. Mapeo publico
    # /hls/<app>/<room>/<file> -> <root>/apps/<app>/hls/<room>/<file>.
    # Con el flag OFF el installer deja /var/empty: try_files siempre falla y TODO
    # cae en @streamhub_core (mismo request, URI original) — cero cambio.
    # Los add_header de este location solo aplican a lo servido del disco; el
    # fallback (@streamhub_core) devuelve los headers del core tal cual.
    # Segmentos que empiezan con '.' (incl. '..') no matchean (misma regla que el
    # safeJoin del core): van al core por `location /`, que los rechaza con 404.
    location ~ ^/hls/(?<hls_app>[^/.][^/]*)/(?<hls_room>[^/.][^/]*)/(?<hls_file>(?:[^/.][^/]*/)*[^/.][^/]*)$ {
        root __STREAMHUB_HLS_ROOT__;
        try_files /apps/$hls_app/hls/$hls_room/$hls_file @streamhub_core;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control $streamhub_hls_cache always;
    }

    # Fallback del core para los misses de /hls (VOD, playlist recien rotado, flag OFF).
    location @streamhub_core {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- streamhub-core (core Go): API (/api/v1) + SPA React (estaticos + fallback) ---
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
