# StreamHub — UN SOLO dominio, UN SOLO servicio (el core Go, binario estático).
# /rtc -> LiveKit signaling (wss). Todo lo demas -> el core Go (streamhub-core), que sirve API + SPA React.
# Reemplazar streamhub.example.com. `certbot --nginx` agrega el bloque 443 (SSL) + redirect 80->443.

# HLS direct-serve: politica de cache por extension (segmentos immutable) y por
# alcance de la app: el core responde el auth_request con X-StreamHub-HLS-Scope
# (public|private) y un segmento de una app PRIVADA nunca se marca cacheable por
# caches compartidos (CDN / edge), igual que cuando lo sirve el core. Las playlists
# ya no salen del disco (van siempre al core, ver abajo). En contexto http para que
# el location /hls la tome con un solo add_header.
map "$streamhub_hls_scope|$uri" $streamhub_hls_cache {
    default             "no-cache";
    ~^private\|.*\.(ts|m4s)$  "private, max-age=31536000, immutable";
    ~^private\|         "private, no-cache";
    ~\.(ts|m4s)$              "public, max-age=31536000, immutable";
}

# Core upstream con keepalive: sin esto cada request (cada segmento/playlist,
# cada auth_request) abre una conexion TCP nueva a 127.0.0.1:3020. Requiere
# HTTP/1.1 + `Connection ""` hacia el upstream (salvo los WebSocket, ver el map).
upstream streamhub_core {
    server 127.0.0.1:3020;
    keepalive 64;
}

# WebSocket del core (/api/v1/edge/ws, ...) sin romper el keepalive del resto.
map $http_upgrade $streamhub_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name streamhub.example.com;
    client_max_body_size 50m;

    # --- LiveKit signaling (WebRTC) — el cliente conecta a wss://streamhub.example.com ---
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- /metrics NO se expone al exterior ---
    # Prometheus scrapea el core en 127.0.0.1:3020/metrics directo (localhost),
    # asi que aca lo bloqueamos. Va ANTES de `location /` (match exacto gana).
    location = /metrics {
        deny all;
        return 403;
    }

    # --- HLS direct-serve (STREAMHUB_HLS_DIRECT_SERVE, operations/SCALING.md) ---
    # Opt-in. Con el flag ON, install.sh reemplaza __STREAMHUB_HLS_ROOT__ por el
    # DATA_DIR del host y __STREAMHUB_HLS_AUTH__ por /_streamhub_hls_auth: nginx
    # sirve los SEGMENTOS en vivo DIRECTO DEL DISCO (sendfile) — el core no toca
    # sus bytes — despues de preguntarle al core si el request esta autorizado
    # (auth_request: apps con public_playback:false exigen ?st=, features.geo).
    # Mapeo publico /hls/<app>/<room>/<file> -> <root>/apps/<app>/hls/<room>/<file>.
    # Con el flag OFF el installer deja root=/var/empty y auth_request off:
    # try_files siempre falla y TODO cae en @streamhub_core (mismo request, URI
    # original), que valida el token el mismo — cero cambio.
    # NUNCA dejar root=DATA_DIR con auth_request off: expondria las apps privadas.
    # Los add_header de este location solo aplican a lo servido del disco; el
    # fallback (@streamhub_core) devuelve los headers del core tal cual.
    # Segmentos que empiezan con '.' (incl. '..') no matchean (misma regla que el
    # safeJoin del core): van al core por `location /`, que los rechaza con 404.

    # Las playlists van SIEMPRE al core (son chicas y no-cache): para una app
    # privada el core las reescribe agregando el ?st= a cada segmento. Va ANTES
    # del location de disco (nginx usa la primera regex que matchea).
    location ~ ^/hls/.+\.m3u8$ {
        proxy_pass http://streamhub_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subrequest de autorizacion (auth_request) -> core /hls-auth: 204 = servir,
    # 403 = denegar. Liviano: HMAC + politica de la app cacheada en el core.
    location = /_streamhub_hls_auth {
        internal;
        proxy_pass http://streamhub_core/hls-auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/hls/(?<hls_app>[^/.][^/]*)/(?<hls_room>[^/.][^/]*)/(?<hls_file>(?:[^/.][^/]*/)*[^/.][^/]*)$ {
        auth_request __STREAMHUB_HLS_AUTH__;
        auth_request_set $streamhub_hls_scope $upstream_http_x_streamhub_hls_scope;
        # Un 403 del auth lo contesta el core (mismo request): el cliente recibe
        # el mismo JSON de error que sin direct-serve.
        error_page 403 = @streamhub_core;
        root __STREAMHUB_HLS_ROOT__;
        try_files /apps/$hls_app/hls/$hls_room/$hls_file @streamhub_core;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control $streamhub_hls_cache always;
    }

    # Fallback del core para los misses de /hls (VOD, playlist recien rotado, flag OFF).
    location @streamhub_core {
        proxy_pass http://streamhub_core;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- streamhub-core (core Go): API (/api/v1) + SPA React (estaticos + fallback) ---
    location / {
        proxy_pass http://streamhub_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $streamhub_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }
}
