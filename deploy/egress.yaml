# LiveKit Egress config — TEMPLATE (grabacion / RTMP out / HLS).
# Se pasa al contenedor via -e EGRESS_CONFIG_BODY="$(cat egress.yaml)".
# El contenedor monta un volumen para los archivos: -v /home/ploi/livekit/recordings:/out
redis:
  address: localhost:6379
ws_url: ws://localhost:7880
api_key: <API_KEY>
api_secret: <API_SECRET>
insecure: false
log_level: info
# CPU reservado por composite (HLS en vivo / grabación). El default de LiveKit (4) deja
# UN solo HLS en vivo por origin de 8 vCPU; un 720p30 midió ~0,9 CPU (LOADTEST-4-REPORT.md).
cpu_cost:
  room_composite_cpu_cost: 2.0
