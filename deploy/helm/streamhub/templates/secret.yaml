{{- if not .Values.secrets.existingSecret }}
{{- $name := include "streamhub.secretName" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $old := dict }}
{{- if $live }}{{- $old = default dict $live.data }}{{- end }}
{{- $s := .Values.secrets }}
# Generated once (same secret formats as install.sh) and then kept: upgrades
# reuse the live values, and `helm uninstall` leaves the Secret behind so a
# reinstall over the same PVC still matches the seeded API token / JWTs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "streamhub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  LIVEKIT_API_KEY: {{ include "streamhub.secretValue" (list $old "LIVEKIT_API_KEY" $s.livekitApiKey (printf "API%s" (randAlphaNum 12))) }}
  LIVEKIT_API_SECRET: {{ include "streamhub.secretValue" (list $old "LIVEKIT_API_SECRET" $s.livekitApiSecret (randAlphaNum 48)) }}
  STREAMHUB_JWT_SECRET: {{ include "streamhub.secretValue" (list $old "STREAMHUB_JWT_SECRET" $s.jwtSecret (randAlphaNum 48)) }}
  ADMIN_USER: {{ include "streamhub.secretValue" (list $old "ADMIN_USER" $s.adminUser "admin") }}
  ADMIN_PASS: {{ include "streamhub.secretValue" (list $old "ADMIN_PASS" $s.adminPass (randAlphaNum 20)) }}
  STREAMHUB_API_TOKEN: {{ include "streamhub.secretValue" (list $old "STREAMHUB_API_TOKEN" $s.apiToken (printf "sk_%s" (randAlphaNum 43))) }}
  METRICS_TOKEN: {{ include "streamhub.secretValue" (list $old "METRICS_TOKEN" $s.metricsToken (printf "mtk_%s" (randAlphaNum 28))) }}
  STREAMHUB_CLUSTER_TOKEN: {{ include "streamhub.secretValue" (list $old "STREAMHUB_CLUSTER_TOKEN" $s.clusterToken (printf "clt_%s" (randAlphaNum 32))) }}
  REDIS_PASSWORD: {{ include "streamhub.secretValue" (list $old "REDIS_PASSWORD" $s.redisPassword (randAlphaNum 32)) }}
{{- end }}
